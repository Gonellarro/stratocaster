  #  restart: unless-stopped
  #  ports:
  #    - "8554:8554"     # RTSP
  #    - "1935:1935"     # RTMP
  #    - "8888:8888"     # HLS (Para ver streaming en navegadores si fuera necesario)
  #    - "8889:8890/udp" # SRT (Mapea el puerto host 8889 al puerto interno 8890 de MediaMTX)
  #    - "8889:8889/tcp" # WebRTC/WHIP Signalling (Para recibir streaming de VDO.ninja)
  #    - "8189:8189/udp" # WebRTC/WHIP ICE (Requerido para la conexión WebRTC)

  image-store:
    build: ./image-store
    container_name: image-store
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - CONTROL_USER=${CONTROL_USER:-admin}
      - CONTROL_PASS=${CONTROL_PASS:-admin}
      - TELEGRAF_MQTT_USER=${TELEGRAF_MQTT_USER:-admin}
      - TELEGRAF_MQTT_PASSWORD=${TELEGRAF_MQTT_PASSWORD:-admin}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-stratocaster_secret_key}
    volumes:
      - ./image-store:/app
      - ./images:/app/images

