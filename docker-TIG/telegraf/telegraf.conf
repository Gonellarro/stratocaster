# ===============================================================================
# CONFIGURACIÓN GLOBAL DEL AGENTE TELEGRAF
# ===============================================================================
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf_srv"
  omit_hostname = false

# ===============================================================================
# INPUT 1: GPS LoRa (ESP32 + LoRa)
# ===============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["gps/data"]
  qos = 0
  connection_timeout = "30s"
  client_id = "telegraf_lora_bridge"
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  topic_tag = "topic"
 
# ===============================================================================
# INPUT 2: GPS del móvil (OwnTracks)
# ===============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["owntracks/#"]  
  #topics = ["Xiaomi15T/gps"]
  qos = 0
  connection_timeout = "30s"
  client_id = "telegraf_gps_bridge"   # client_id distinto, obligatorio
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  topic_tag = "topic"

# ===============================================================================
# INPUT 3: Sonda Cámara (Imagen + Texto + GPS del móvil)
# ===============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sonda/camera"]
  qos = 0
  connection_timeout = "30s"
  client_id = "telegraf_camera_bridge"
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  topic_tag = "topic"
  json_string_fields = ["texto", "url_imagen"]

# ===============================================================================
# PROCESSORS: Renombrar lat/lon solo para el topic GPS
# ===============================================================================
[[processors.rename]]
  [processors.rename.tagpass]
    topic = ["Xiaomi15T/gps"]         # solo afecta a este topic
  [[processors.rename.replace]]
    field = "lat"
    dest = "latitude"
  [[processors.rename.replace]]
    field = "lon"
    dest = "longitude"

# ===============================================================================
# OUTPUT: InfluxDB v2
# ===============================================================================
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
