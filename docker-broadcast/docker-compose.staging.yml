services:
  image-store:
    container_name: image-store-staging
    env_file:
      - .env.staging
    environment:
      CONTROL_USER: ${CONTROL_USER}
      CONTROL_PASS: ${CONTROL_PASS}
      TELEGRAF_MQTT_USER: ${TELEGRAF_MQTT_USER}
      TELEGRAF_MQTT_PASSWORD: ${TELEGRAF_MQTT_PASSWORD}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_COMMAND_USER: ${MQTT_COMMAND_USER}
      MQTT_COMMAND_PASSWORD: ${MQTT_COMMAND_PASSWORD}
      MQTT_VIEW_USER: ${MQTT_VIEW_USER}
      MQTT_VIEW_PASSWORD: ${MQTT_VIEW_PASSWORD}
      SONDA_DEVICE_ID: ${SONDA_DEVICE_ID:-movil_sonda_test}
      VDO_NINJA_VIEW_URL: ${VDO_NINJA_VIEW_URL:-https://vdo.ninja/?view=9GJw2rs}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    ports:
      - "5000:5000"
    volumes:
      - ./image-store:/app
      - ./images:/app/images
      - launch_state_staging:/data

volumes:
  launch_state_staging:
    name: image-store-staging-launch-state
