# ===============================================================================
# CONFIGURACIÓN GLOBAL DEL AGENTE TELEGRAF
# ===============================================================================
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf_srv"
  omit_hostname = false

# ===============================================================================
# INPUT: Consumidor MQTT Multi-Dispositivo Estandarizado (Jerarquía sonda/+/+/+)
# ===============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "sonda/mobile/+/telemetry",
    "sonda/lora/+/telemetry"
  ]
  qos = 1
  connection_timeout = "30s"
  client_id = "telegraf_sonda_bridge"
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  topic_tag = "topic"
  # Extraer la estructura del topic en Tags de InfluxDB
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sonda/+/+/+"
    measurement = "measurement/_/_/_"
    tags = "_/subsystem/device_id/data_type"

# ===============================================================================
# OUTPUT: InfluxDB v2
# ===============================================================================
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
