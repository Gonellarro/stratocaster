services:
  #mediamtx:
  #  image: bluenviron/mediamtx:latest
  #  container_name: mediamtx
  #  restart: unless-stopped
  #  ports:
  #    - "8554:8554"     # RTSP
  #    - "1935:1935"     # RTMP
  #    - "8888:8888"     # HLS (Para ver streaming en navegadores si fuera necesario)
  #    - "8889:8890/udp" # SRT (Mapea el puerto host 8889 al puerto interno 8890 de MediaMTX)
  #    - "8889:8889/tcp" # WebRTC/WHIP Signalling (Para recibir streaming de VDO.ninja)
  #    - "8189:8189/udp" # WebRTC/WHIP ICE (Requerido para la conexión WebRTC)

  image-store:
    build: ./image-store
    container_name: image-store
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - CONTROL_USER=${CONTROL_USER}
      - CONTROL_PASS=${CONTROL_PASS}
      - TELEGRAF_MQTT_USER=${TELEGRAF_MQTT_USER}
      - TELEGRAF_MQTT_PASSWORD=${TELEGRAF_MQTT_PASSWORD}
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_COMMAND_USER=${MQTT_COMMAND_USER}
      - MQTT_COMMAND_PASSWORD=${MQTT_COMMAND_PASSWORD}
      - MQTT_VIEW_USER=${MQTT_VIEW_USER}
      - MQTT_VIEW_PASSWORD=${MQTT_VIEW_PASSWORD}
      - SONDA_DEVICE_ID=${SONDA_DEVICE_ID:-movil_sonda_1}
      - LORA_DEVICE_ID=${LORA_DEVICE_ID:-rx_sonda}
      - VDO_NINJA_VIEW_URL=${VDO_NINJA_VIEW_URL:-https://vdo.ninja/?view=sonda_stratocaster}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    volumes:
      - ./image-store:/app
      - ./images:/app/images
      - launch_state:/data
    networks:
      - default
      - telemetry_net

volumes:
  launch_state:

networks:
  telemetry_net:
    external: true
    name: sonda_telemetry
